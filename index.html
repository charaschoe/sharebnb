	<head>
		<meta charset="UTF-8" />

		<title>ShareBnB</title>

			rel="stylesheet"
		/>

		<link rel="stylesheet" href="css/layout.css?v=6" />
		<link rel="stylesheet" href="css/tabs.css?v=7" />
		<link rel="stylesheet" href="css/tab-interaction.css?v=7" />
		<link rel="stylesheet" href="css/content.css?v=8" />
		<link rel="stylesheet" href="css/newyork_dots.css?v=7" />
		<link rel="stylesheet" href="css/tokyo.css?v=7" />
		<link rel="stylesheet" href="css/circle.css?v=6" />
		<link rel="stylesheet" href="css/barchart.css?v=6" />

	</head>
	<body>
		<main>
			<section>
				<div class="container">
					<label for="tab_1">
						<div id="content" class="sharebnb">ShareBnB</div>
						<div id="tab_1-content" class="tab-content intro-panel">
							<div class="intro-copy">
								<p>
									Living space in many large cities has become a luxury that fewer and fewer people can afford, largely due to the overwhelming dominance of short-term rentals like Airbnb. Entire neighborhoods are being hollowed out as homes are rented to tourists rather than to locals, pushing residents out and driving rental prices through the roof.
								</p>
								<p>
									In New York City, Paris, and Tokyo, short-term rental pressure intersects with tourism, speculation, and fragile housing markets. ShareBnB exposes how listings cluster, who can still afford the city, and how platform economics reshape local neighborhoods.
								</p>
								<p>
									The visualization is a call to question why we allow the commodification of living space to displace the people who live and work in these cities.
								</p>
								<p class="credits">
									Dr. Franklin Hernandez Castro<br />
									Data Visualisation<br />
									HfG Schwabisch Gmund IG3<br />
									Jonas Wienberg, Marlon Mutlu, Philipp Maginot
								</p>
							</div>
						</div>
					</label>

					<label for="tab_2">
						<div id="content" class="new-york">NEW YORK</div>
						<div class="tab-content">
							<div class="city-panel">
								<section class="panel-kpis">
									<h1>N° of Airbnb listings <span class="city-name">New York</span> <span id="total-ids-new-york">Loading...</span></h1>
									<h3><span id="apartments-new-york">Loading...</span></h3>
									<h3><span id="population-new-york">Loading...</span> / <span id="tourists-new-york">Loading...</span></h3>
									<h3><span id="airbnb-index-new-york">Loading...</span></h3>
								</section>
								<section class="panel-copy">
									<p>Airbnbs in New York City, especially in Manhattan and Brooklyn, have exacerbated the housing crisis by turning residential units into short-term rentals, reducing long-term housing availability and increasing rents. Local Law 18 tries to limit rentals to registered, host-present stays, but the city still carries the pressure of platform tourism.</p>
								</section>
								<section class="viz-slot">
									<div class="viz-frame">
										<div class="dots-wrapper" id="dots"></div>
									</div>
									<p class="viz-caption" id="info-text">A 50-person affordability sample based on median income and nightly Airbnb price.</p>
								</section>
								<section class="viz-slot">
									<div class="viz-frame" id="new-york-bubbles">
										<svg aria-label="New York Airbnb listings by borough"></svg>
									</div>
									<p class="viz-caption" id="info-text-new-york">Click a borough bubble to compare listing pressure by area.</p>
								</section>
							</div>
						</div>
					</label>

					<label for="tab_3">
						<div id="content" class="tokyo">TOKYO</div>
						<div class="tab-content">
							<div class="city-panel">
								<section class="panel-kpis">
									<h1>N° of Airbnb listings <span class="city-name">Tokyo</span> <span id="total-ids-tokyo">Loading...</span></h1>
									<h3><span id="apartments-tokyo">Loading...</span></h3>
									<h3><span id="population-tokyo">Loading...</span> / <span id="tourists-tokyo">Loading...</span></h3>
									<h3><span id="airbnb-index-tokyo">Loading...</span></h3>
								</section>
								<section class="panel-copy">
									<p>Tokyo combines dense residential life with heavy short-term rental demand. The room-type split and host concentration reveal where Airbnb shifts from occasional sharing into commercial operation.</p>
								</section>
								<section class="viz-slot">
									<div class="viz-frame" id="treemap-container"></div>
									<p class="viz-caption" id="percentage-output-room-types">Click a room type to inspect neighborhood distribution.</p>
								</section>
								<section class="viz-slot">
									<div class="viz-frame" id="chart-container"></div>
									<p class="viz-caption" id="percentage-output-hosts">Hosts with many listings point to professionalized short-term rental portfolios.</p>
									<div class="tooltip" id="tooltip"></div>
								</section>
							</div>
						</div>
					</label>

					<label for="tab_4">
						<div id="content" class="paris">PARIS</div>
						<div class="tab-content">
							<div class="city-panel">
								<section class="panel-kpis">
									<h1>N° of Airbnb listings <span class="city-name">Paris</span> <span id="total-ids-paris">Loading...</span></h1>
									<h3><span id="apartments-paris">Loading...</span></h3>
									<h3><span id="population-paris">Loading...</span> / <span id="tourists-paris">Loading...</span></h3>
									<h3><span id="airbnb-index-paris">Loading...</span></h3>
								</section>
								<section class="panel-copy">
									<p>Paris concentrates short-term rental demand inside a compact housing market. Minimum-night rules and availability patterns show how listings shift between tourist accommodation and long-term housing pressure.</p>
								</section>
								<section class="viz-slot">
									<div class="viz-frame" id="chart-container-paris"></div>
									<p class="viz-caption" id="hover-info">Hover over a bar to see details.</p>
								</section>
								<section class="viz-slot">
									<div class="viz-frame rest-group">
										<canvas id="canvas"></canvas>
									</div>
									<div id="slider-container">
										<input type="range" id="slider" min="1" max="32" value="7">
										<div class="viz-caption" id="slider-value">Minimum Nights: 7</div>
									</div>
								</section>
							</div>
						</div>
					</label>
				</div>
			</section>
		</main>

		<script type="module" src="js/circle.js?v=7"></script>
	</body>
</html>
